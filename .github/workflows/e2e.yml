name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Verify static site and committed ZIP
        run: npm run test:ci
      - run: npm audit --audit-level=high
